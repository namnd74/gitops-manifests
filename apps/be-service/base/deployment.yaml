apiVersion: apps/v1
kind: Deployment
metadata:
  name: be-service
  labels:
    app: be-service
spec:
  replicas: 1
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: be-service
  template:
    metadata:
      labels:
        app: be-service
    spec:
      containers:
        - name: app
          image: ghcr.io/example/be-service:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: APP_ENV
              value: "base"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: be-service-secret
                  key: DB_PASSWORD
                  optional: false
            - name: DEMO_MODE
              value: "false"
            - name: DEMO_FAULT
              value: "false"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
