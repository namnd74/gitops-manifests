apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../base
  - sealed-secret.yaml

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "dev"
    target:
      kind: Deployment
      name: be-service
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.local
      - op: add
        path: /spec/rules/-
        value:
          host: localhost
          http:
            paths:
              - path: /app
                pathType: Prefix
                backend:
                  service:
                    name: be-service
                    port:
                      number: 80
    target:
      kind: Ingress
      name: be-service

images:
  - name: ghcr.io/namnd74/be-service
    newTag: sha-57d207d
