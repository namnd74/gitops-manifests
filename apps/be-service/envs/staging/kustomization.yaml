apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base
  - sealed-secret.yaml

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "staging"
    target:
      kind: Deployment
      name: be-service
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.local
    target:
      kind: Ingress
      name: be-service

images:
  - name: ghcr.io/namnd74/be-service
    newTag: v1.0.0
