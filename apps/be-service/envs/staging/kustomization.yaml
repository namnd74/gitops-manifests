apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
patches:
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.127.0.0.1.nip.io
    target:
      kind: Ingress
      name: be-service
  - path: deployment-env-patch.yaml
resources:
  - ../../base
configMapGenerator:
  - name: be-service-config
    envs:
      - environment.env
