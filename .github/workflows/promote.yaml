name: Promote release
on:
  workflow_dispatch:
    inputs:
      from: {required: true, type: choice, options: [dev, staging]}
      to: {required: true, type: choice, options: [staging, prod]}
permissions: {contents: read}
concurrency:
  group: gitops-release-${{ inputs.to }}
  cancel-in-progress: false
env:
  SOURCE_REPO: namnd74/be-service
  IMAGE: ghcr.io/namnd74/be-service
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Require config repository credential
        env:
          CONFIG_REPO_PAT: ${{ secrets.CONFIG_REPO_PAT }}
        run: test -n "$CONFIG_REPO_PAT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.from }}
          fetch-depth: 0
          token: ${{ secrets.CONFIG_REPO_PAT }}
      - name: Install pinned YAML tools
        run: bash scripts/install-ci-tools.sh
      - uses: sigstore/cosign-installer@6e04d228eb30da1757ee4e1dd75a0ec73a653e06 # v3.1.1
        with: {cosign-release: 'v2.6.1'}
      - name: Log in to GHCR
        env:
          CONFIG_REPO_PAT: ${{ secrets.CONFIG_REPO_PAT }}
        run: echo "$CONFIG_REPO_PAT" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Prepare verified promotion
        id: release
        env:
          FROM_ENV: ${{ inputs.from }}
          TO_ENV: ${{ inputs.to }}
          GH_TOKEN: ${{ secrets.CONFIG_REPO_PAT }}
        run: |
          set -euo pipefail
          case "$FROM_ENV:$TO_ENV" in dev:staging|staging:prod) ;; *) echo "Unsupported promotion pair" >&2; exit 2 ;; esac
          bash scripts/validate-manifests.sh
          source=$(kustomize build "apps/be-service/envs/$FROM_ENV")
          fault=$(yq -r 'select(.kind == "Deployment" and .metadata.name == "be-service") | .spec.template.spec.containers[0].env[] | select(.name == "DEMO_FAULT") | .value' <<< "$source")
          [[ "$fault" == false ]] || { echo 'Cannot promote a faulted environment' >&2; exit 1; }
          ref=$(yq -er 'select(.kind == "Deployment" and .metadata.name == "be-service") | .spec.template.spec.containers[0].image' <<< "$source")
          bash scripts/verify-image.sh "$ref" "$SOURCE_REPO"
          # Branch merge promotes the shared digest; environment settings must agree.
          for file in apps/be-service/envs/*/*.yaml argocd/applications/*.yaml; do
            git show "origin/$TO_ENV:$file" > "$RUNNER_TEMP/target-config.yaml"
            cmp -s "$file" "$RUNNER_TEMP/target-config.yaml" || {
              echo "Environment configuration differs: $file; reconcile separately before promotion" >&2; exit 1;
            }
          done
      - name: Create promotion pull request
        env:
          GH_TOKEN: ${{ secrets.CONFIG_REPO_PAT }}
          FROM_ENV: ${{ inputs.from }}
          TO_ENV: ${{ inputs.to }}
          IMAGE_REF: ${{ steps.release.outputs.image_ref }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --base "$TO_ENV" --head "$FROM_ENV" --json url --jq '.[0].url // empty')
          if [[ -n "$existing" ]]; then echo "$existing"; exit 0; fi
          # shellcheck disable=SC2016 # Markdown backticks are literal text.
          printf 'Artifact: `%s`\n\nMerge %s into %s with a merge commit to retain promotion history. Source health must pass before merge.\n' "$IMAGE_REF" "$FROM_ENV" "$TO_ENV" > "$RUNNER_TEMP/promotion-body.md"
          gh pr create --base "$TO_ENV" --head "$FROM_ENV" \
            --title "release: $FROM_ENV to $TO_ENV" --body-file "$RUNNER_TEMP/promotion-body.md"
