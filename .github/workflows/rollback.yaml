name: Restore release
on:
  workflow_dispatch:
    inputs:
      env: {required: true, type: choice, options: [dev, staging, prod]}
      revision:
        required: true
        type: string
        description: Known-good hexadecimal config Git revision
permissions: {contents: read}
concurrency:
  group: gitops-release-${{ inputs.env }}
  cancel-in-progress: false
env:
  SOURCE_REPO: namnd74/be-service
  IMAGE: ghcr.io/namnd74/be-service
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Require config repository credential
        env:
          CONFIG_REPO_PAT: ${{ secrets.CONFIG_REPO_PAT }}
        run: test -n "$CONFIG_REPO_PAT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.env }}
          fetch-depth: 0
          token: ${{ secrets.CONFIG_REPO_PAT }}
      - name: Install pinned YAML tools
        run: bash scripts/install-ci-tools.sh
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: 'v3.1.3'}
      - name: Log in to GHCR
        env:
          CONFIG_REPO_PAT: ${{ secrets.CONFIG_REPO_PAT }}
        run: echo "$CONFIG_REPO_PAT" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Prepare verified restore
        id: release
        env:
          RESTORE_ENV: ${{ inputs.env }}
          REVISION: ${{ inputs.revision }}
          GH_TOKEN: ${{ secrets.CONFIG_REPO_PAT }}
        run: |
          set -euo pipefail
          case "$RESTORE_ENV" in dev|staging|prod) ;; *) exit 2 ;; esac
          [[ "$REVISION" =~ ^[0-9a-fA-F]{7,40}$ ]] || { echo "Invalid config revision" >&2; exit 2; }
          directory="apps/be-service/envs/$RESTORE_ENV"
          # Restore only the shared image reference and this environment's patch.
          git show "$REVISION:apps/be-service/base/kustomization.yaml" > "$RUNNER_TEMP/base.yaml"
          old_digest=$(yq -er '.images[] | select(.name == env(IMAGE)) | .digest' "$RUNNER_TEMP/base.yaml")
          [[ "$old_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Rollback requires a digest revision' >&2; exit 1; }
          git show "$REVISION:$directory/deployment-env-patch.yaml" > "$RUNNER_TEMP/patch.yaml"
          (cd apps/be-service/base && kustomize edit set image "$IMAGE=$IMAGE@$old_digest")
          cp "$RUNNER_TEMP/patch.yaml" "$directory/deployment-env-patch.yaml"
          bash scripts/validate-manifests.sh
          restored=$(kustomize build "$directory")
          fault=$(yq -r 'select(.kind == "Deployment" and .metadata.name == "be-service") | .spec.template.spec.containers[0].env[] | select(.name == "DEMO_FAULT") | .value' <<< "$restored")
          [[ "$fault" == false ]] || { echo 'Rollback target is faulted' >&2; exit 1; }
          ref=$(yq -er 'select(.kind == "Deployment" and .metadata.name == "be-service") | .spec.template.spec.containers[0].image' <<< "$restored")
          bash scripts/verify-image.sh "$ref" "$SOURCE_REPO"
      - name: Create rollback pull request
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.CONFIG_REPO_PAT }}
          base: ${{ inputs.env }}
          add-paths: |
            apps/be-service/base/kustomization.yaml
            apps/be-service/envs/${{ inputs.env }}/deployment-env-patch.yaml
          title: "rollback: ${{ inputs.env }} to ${{ inputs.revision }}"
          commit-message: "chore(release): restore ${{ inputs.env }} from ${{ inputs.revision }}"
          branch: rollback-${{ inputs.env }}
          body: |
            Config revision: `${{ inputs.revision }}`
            Artifact: `${{ steps.release.outputs.image_ref }}`
            Source: https://github.com/namnd74/be-service/commit/${{ steps.release.outputs.source_sha }}
            Signature and provenance verified. Secret ciphertext is unchanged.
