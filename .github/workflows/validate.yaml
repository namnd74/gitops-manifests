name: Validate manifests
on:
  pull_request:
  push:
    branches: [main, dev, stg, prod]
permissions: {contents: read}
env:
  IMAGE: ${{ vars.IMAGE || 'ghcr.io/example/be-service' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0}
      - name: Install pinned YAML tools
        run: bash scripts/install-ci-tools.sh
      - name: Validate rendered configuration
        run: bash scripts/validate-manifests.sh
      - name: Test local and release behavior
        run: python3 -m unittest discover -s scripts/tests -v
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name == 'pull_request' && contains(fromJSON('["dev","stg","prod"]'), github.base_ref)
        with: {cosign-release: 'v3.1.3'}
      - name: Validate release branch PR
        if: github.event_name == 'pull_request' && contains(fromJSON('["dev","stg","prod"]'), github.base_ref)
        env:
          BASE_ENV: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ secrets.CONFIG_REPO_PAT }}
          SOURCE_REPO: ${{ vars.SOURCE_REPO || format('{0}/be-service', github.repository_owner) }}
        run: |
          set -euo pipefail
          [[ "$BASE_ENV" =~ ^(dev|stg|prod)$ ]] || { echo 'Invalid release branch pair' >&2; exit 1; }
          if [[ "$HEAD_BRANCH" == release-be-service-* ]]; then
            [[ "$HEAD_BRANCH" == "release-be-service-$BASE_ENV" ]] || { echo 'Invalid release branch pair' >&2; exit 1; }
            for file in apps/be-service/envs/*/*.yaml apps/be-service/envs/*/*.env; do
              [[ -f "$file" ]] || continue
              git show "origin/$BASE_ENV:$file" > "$RUNNER_TEMP/target-config.yaml"
              cmp -s "$file" "$RUNNER_TEMP/target-config.yaml" || {
                echo "Environment configuration differs: $file" >&2; exit 1;
              }
            done
          fi
          # Compare effective images, including overrides in environment patches.
          environment=$BASE_ENV
          [[ "$environment" != stg ]] || environment=staging
          rendered=$(kustomize build "apps/be-service/envs/$environment")
          ref=$(yq -er 'select(.kind == "Deployment" and .metadata.name == "be-service") | .spec.template.spec.containers[0].image' <<< "$rendered")
          target=$(mktemp -d)
          trap 'rm -rf "$target"' EXIT
          git archive "origin/$BASE_ENV" apps | tar -x -C "$target"
          previous=$(kustomize build "$target/apps/be-service/envs/$environment" |
            yq -er 'select(.kind == "Deployment" and .metadata.name == "be-service") | .spec.template.spec.containers[0].image')
          if [[ "$ref" == "$previous" ]]; then
            echo 'Effective image unchanged; configuration validation is sufficient.'
            exit 0
          fi
          bash scripts/verify-image.sh "$ref" "$SOURCE_REPO" "$BASE_ENV"
